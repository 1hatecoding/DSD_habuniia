apiVersion: v1

kind: Namespace

metadata:

  name: bank-system

apiVersion: v1

kind: ServiceAccount

metadata:

  name: microservices-sa

  namespace: bank-system

---

apiVersion: rbac.authorization.k8s.io/v1

kind: Role

metadata:

  name: microservices-reader

  namespace: bank-system

rules:

  - apiGroups: [""]

    resources: ["endpoints", "pods", "services", "configmaps"]

    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1

kind: RoleBinding

metadata:

  name: microservices-reader-binding

  namespace: bank-system

subjects:

  - kind: ServiceAccount

    name: microservices-sa

    namespace: bank-system

roleRef:

  kind: Role

  name: microservices-reader

  apiGroup: rbac.authorization.k8s.io

apiVersion: v1

kind: ConfigMap

metadata:

  name: app-config

  namespace: bank-system

data:

  # General K8s Discovery

  K8S_NAMESPACE: "bank-system"

  K8S_LOGGING_SERVICE_NAME: "logging-service"

  K8S_COUNTER_SERVICE_NAME: "counter-service"



  # Hazelcast Client Config (Req. 3)

  HAZELCAST_CLUSTER_NAME: "dev"

  HAZELCAST_CLUSTER_MEMBERS: "hazelcast-service:5701"



  # Message Queue Config (Req. 4)

  HAZELCAST_QUEUE_NAME: "counter_queue"



  # PostgreSQL DB Config

  DATABASE_URL: "postgresql://postgres:postgrespassword@postgres-service:5432/bank"



  # Application Flags

  LOG_TRANSACTIONS: "true"

apiVersion: apps/v1

kind: Deployment

metadata:

  name: postgres

  namespace: bank-system

  labels:

    app: postgres

spec:

  replicas: 1

  selector:

    matchLabels:

      app: postgres

  template:

    metadata:

      labels:

        app: postgres

    spec:

      containers:

        - name: postgres

          image: postgres:16-alpine

          ports:

            - containerPort: 5432

              name: postgres

          env:

            - name: POSTGRES_DB

              value: "bank"

            - name: POSTGRES_USER

              value: "postgres"

            - name: POSTGRES_PASSWORD

              value: "postgrespassword"

          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "500m"

              memory: "512Mi"

---

apiVersion: v1

kind: Service

metadata:

  name: postgres-service

  namespace: bank-system

spec:

  type: ClusterIP

  ports:

    - port: 5432

      targetPort: 5432

      name: postgres

  selector:

    app: postgres

apiVersion: v1

kind: ConfigMap

metadata:

  name: hazelcast-config

  namespace: bank-system

data:

  hazelcast.yaml: |

    hazelcast:

      cluster-name: dev

      network:

        port:

          port: 5701

          auto-increment: false

        join:

          multicast:

            enabled: false

          kubernetes:

            enabled: true

            service-name: hazelcast-service

            namespace: bank-system

      queue:

        counter_queue:

          max-size: 100000

          backup-count: 1

          async-backup-count: 1

          empty-queue-ttl: -1

      map:

        transactions:

          backup-count: 1

          async-backup-count: 1

          in-memory-format: OBJECT

---

apiVersion: v1

kind: Service

metadata:

  name: hazelcast-service

  namespace: bank-system

spec:

  type: ClusterIP

  clusterIP: None

  ports:

    - port: 5701

      targetPort: 5701

      name: hazelcast

  selector:

    app: hazelcast

---

apiVersion: apps/v1

kind: StatefulSet

metadata:

  name: hazelcast

  namespace: bank-system

  labels:

    app: hazelcast

spec:

  serviceName: hazelcast-service

  replicas: 3

  selector:

    matchLabels:

      app: hazelcast

  template:

    metadata:

      labels:

        app: hazelcast

    spec:

      serviceAccountName: microservices-sa

      containers:

        - name: hazelcast

          image: hazelcast/hazelcast:5.5.0

          ports:

            - containerPort: 5701

              name: hazelcast

          env:

            - name: HZ_CONFIG

              value: "/opt/hazelcast/config_ext/hazelcast.yaml"

          volumeMounts:

            - name: config-volume

              mountPath: /opt/hazelcast/config_ext

          resources:

            requests:

              cpu: "150m"

              memory: "256Mi"

            limits:

              cpu: "500m"

              memory: "768Mi"

      volumes:

        - name: config-volume

          configMap:

            name: hazelcast-config

apiVersion: apps/v1

kind: Deployment

metadata:

  name: logging-service

  namespace: bank-system

  labels:

    app: logging-service

spec:

  replicas: 3

  selector:

    matchLabels:

      app: logging-service

  template:

    metadata:

      labels:

        app: logging-service

    spec:

      serviceAccountName: microservices-sa

      containers:

        - name: logging-service

          image: logging-service:k8s

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8001

              name: http

          envFrom:

            - configMapRef:

                name: app-config

          env:

            - name: PORT

              value: "8001"

            - name: INSTANCE_NAME

              valueFrom:

                fieldRef:

                  fieldPath: metadata.name

          readinessProbe:

            httpGet:

              path: /health

              port: 8001

            initialDelaySeconds: 5

            periodSeconds: 5

          livenessProbe:

            httpGet:

              path: /health

              port: 8001

            initialDelaySeconds: 10

            periodSeconds: 10

          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "300m"

              memory: "384Mi"

---

apiVersion: v1

kind: Service

metadata:

  name: logging-service

  namespace: bank-system

spec:

  type: ClusterIP

  ports:

    - port: 8001

      targetPort: 8001

      name: http

  selector:

    app: logging-service

apiVersion: apps/v1

kind: Deployment

metadata:

  name: counter-service

  namespace: bank-system

  labels:

    app: counter-service

spec:

  replicas: 1

  selector:

    matchLabels:

      app: counter-service

  template:

    metadata:

      labels:

        app: counter-service

    spec:

      serviceAccountName: microservices-sa

      containers:

        - name: counter-service

          image: counter-service:k8s

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8002

              name: http

          envFrom:

            - configMapRef:

                name: app-config

          env:

            - name: PORT

              value: "8002"

          readinessProbe:

            httpGet:

              path: /health

              port: 8002

            initialDelaySeconds: 5

            periodSeconds: 5

          livenessProbe:

            httpGet:

              path: /health

              port: 8002

            initialDelaySeconds: 10

            periodSeconds: 10

          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "300m"

              memory: "384Mi"

---

apiVersion: v1

kind: Service

metadata:

  name: counter-service

  namespace: bank-system

spec:

  type: ClusterIP

  ports:

    - port: 8002

      targetPort: 8002

      name: http

  selector:

    app: counter-service

apiVersion: apps/v1

kind: Deployment

metadata:

  name: facade-service

  namespace: bank-system

  labels:

    app: facade-service

spec:

  replicas: 1

  selector:

    matchLabels:

      app: facade-service

  template:

    metadata:

      labels:

        app: facade-service

    spec:

      serviceAccountName: microservices-sa

      containers:

        - name: facade-service

          image: facade-service:k8s

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8000

              name: http

          envFrom:

            - configMapRef:

                name: app-config

          env:

            - name: PORT

              value: "8000"

          readinessProbe:

            httpGet:

              path: /health

              port: 8000

            initialDelaySeconds: 5

            periodSeconds: 5

          livenessProbe:

            httpGet:

              path: /health

              port: 8000

            initialDelaySeconds: 10

            periodSeconds: 10

          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "300m"

              memory: "384Mi"

---

apiVersion: v1

kind: Service

metadata:

  name: facade-service

  namespace: bank-system

spec:

  type: NodePort

  ports:

    - port: 8000

      targetPort: 8000

      nodePort: 30080

      name: http

  selector:

    app: facade-service

