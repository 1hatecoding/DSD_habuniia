apiVersion: v1
kind: ServiceAccount
metadata:
  name: microservices-sa
  namespace: bank-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microservices-reader
  namespace: bank-system
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: microservices-reader-binding
  namespace: bank-system
subjects:
  - kind: ServiceAccount
    name: microservices-sa
    namespace: bank-system
roleRef:
  kind: Role
  name: microservices-reader
  apiGroup: rbac.authorization.k8s.io
